[tool.ruff]
target-version = "py312"
include = ["*.py"]
extend-exclude = [".venv", "data", "artifacts", "storage", "tracking"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"pipeline.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["test_pipeline.py"]
